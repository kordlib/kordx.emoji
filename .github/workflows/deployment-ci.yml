# This workflow will build a package using Gradle and then publish it to maven

name: Kotlin CI

on:
  push:
    branches:
      - '**' # We want to run this on all branch pushes
    tags-ignore:
      - '**' # We don't want this to run on tags pushes
  pull_request:
  release:
    types: [ published ]

jobs:
  build:
    name: Build Kordx.emoji
    runs-on: ubuntu-latest
    if: |
      !contains(github.event.head_commit.message, '[ci skip]') && !contains(github.event.pull_request.title, '[ci skip]')
      && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'kordlib/kord')
    env:
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Build with Gradle
        run: ./gradlew build javadocJar --stacktrace --info

  release:
    name: Publish artifacts
    runs-on: ubuntu-latest
    needs: build
    if: |
      !contains(github.event.head_commit.message, '[publish skip]') && github.event_name != 'pull_request' &&  github.ref != 'refs/heads/master'
    env:
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      GITHUB_TAG_NAME: ${{ github.event.release.tag_name }}
      GITHUB_TARGET_COMMITISH: ${{ github.event.release.target_commitish }}
      GITHUB_BRANCH_NAME: ${{ github.ref }}
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.NEXUS_USER }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.NEXUS_PASSWORD }}
      GITHUB_USERNAME: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY_ARMORED }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD_RAW }}
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Publish with gradle
        run: ./gradlew --no-parallel -x test publish
